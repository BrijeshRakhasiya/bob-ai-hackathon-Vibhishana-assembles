<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" font-family="Arial,sans-serif">
  <rect width="1200" height="800" fill="#0a0f1e"/>
  <!-- Header -->
  <rect x="0" y="0" width="1200" height="64" fill="#111827" stroke="#1e3a5f" stroke-width="1"/>
  <text x="24" y="22" fill="#60a5fa" font-size="14" font-weight="600">RouteGuard AI</text>
  <text x="24" y="42" fill="#94a3b8" font-size="11">IBM BoB Grounded Dispatcher Copilot</text>
  <rect x="900" y="14" width="220" height="26" rx="4" fill="#1e3a5f"/>
  <text x="912" y="32" fill="#38bdf8" font-size="11">IBM BoB AI Hackathon 2026</text>
  <!-- Nav Tabs -->
  <rect x="0" y="64" width="1200" height="44" fill="#0f172a"/>
  <text x="22" y="91" fill="#64748b" font-size="11">Control Tower Overview</text>
  <text x="210" y="91" fill="#64748b" font-size="11">Cold Chain IoT</text>
  <text x="360" y="91" fill="#64748b" font-size="11">Carrier Auction</text>
  <text x="510" y="91" fill="#64748b" font-size="11">Fleet Assets</text>
  <rect x="635" y="72" width="160" height="28" rx="4" fill="#1e3a5f"/>
  <text x="645" y="91" fill="#60a5fa" font-size="11" font-weight="700">IBM BoB Copilot</text>
  <!-- Main Card -->
  <rect x="12" y="120" width="1176" height="648" rx="8" fill="#111827" stroke="#1e3a5f" stroke-width="1"/>
  <text x="28" y="148" fill="#e2e8f0" font-size="16" font-weight="700">IBM BoB Grounded Dispatcher Copilot</text>
  <rect x="800" y="130" width="260" height="28" rx="5" fill="#1e40af"/>
  <text x="814" y="149" fill="#93c5fd" font-size="12" font-weight="600">Zero-Hallucination Guardrails Active</text>
  <text x="28" y="168" fill="#94a3b8" font-size="11">Translates risk scores, cold-chain breaches, and carrier bids into instant dispatcher-ready natural-language briefs.</text>
  <!-- Chat History Area -->
  <rect x="28" y="182" width="1140" height="460" rx="6" fill="#0f172a" stroke="#1e3a5f" stroke-width="1"/>
  <!-- BoB Greeting Message -->
  <rect x="44" y="198" width="900" height="88" rx="8" fill="#1e3a5f"/>
  <rect x="44" y="198" width="900" height="22" rx="4" fill="#1d4ed8"/>
  <text x="56" y="214" fill="#93c5fd" font-size="10" font-weight="600">IBM BoB Copilot - Grounded Response</text>
  <text x="44" y="244" fill="#e2e8f0" font-size="12">Welcome Dispatcher! I have analyzed 142 active shipments.</text>
  <text x="44" y="264" fill="#e2e8f0" font-size="12">SHP-1001 (Polio Vaccines) requires immediate attention: Risk Score 85/100 | Cold-chain excursion 10.4C | NH-48 flooding.</text>
  <text x="44" y="281" fill="#94a3b8" font-size="10">How can I assist you? I can explain any risk score, recommend reroutes, or brief you on fleet status.</text>
  <!-- User Message 1 -->
  <rect x="700" y="306" width="460" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="716" y="326" fill="#e2e8f0" font-size="12">Summarize the risk situation for SHP-1001</text>
  <text x="716" y="346" fill="#64748b" font-size="10">Sent by dispatcher - 14:32 IST</text>
  <!-- BoB Response -->
  <rect x="44" y="374" width="940" height="130" rx="8" fill="#1e3a5f"/>
  <rect x="44" y="374" width="940" height="22" rx="4" fill="#1d4ed8"/>
  <text x="56" y="390" fill="#93c5fd" font-size="10" font-weight="600">IBM BoB Copilot - Grounded Response (sources: risk_engine, cold_chain_engine, reroute_engine)</text>
  <text x="56" y="416" fill="#e2e8f0" font-size="12">SHP-1001 (Vaccines, Rs 65L) has a risk score of 85/100 (CRITICAL).</text>
  <text x="56" y="436" fill="#e2e8f0" font-size="12">Contributing factors: disruption_severity=55pts (CRITICAL: NH-48 Monsoon Flood), cargo_sensitivity=20pts (cold_chain), cargo_value=15pts.</text>
  <text x="56" y="456" fill="#e2e8f0" font-size="12">Cold chain excursion: 10.4C peak, 120 min duration, severity=QUARANTINE_REQUIRED (WHO TRS 961).</text>
  <text x="56" y="476" fill="#fbbf24" font-size="12" font-weight="600">RECOMMENDED ACTION: Bypass via NH48 alternate carriageway (+3.5h, +Rs 2,200). Projected risk after: 38/100.</text>
  <text x="56" y="494" fill="#64748b" font-size="10">All figures cited directly from deterministic engine output - no values have been generated by inference.</text>
  <!-- Input Box -->
  <rect x="28" y="654" width="1000" height="44" rx="6" fill="#0f172a" stroke="#1e3a5f" stroke-width="1"/>
  <text x="44" y="681" fill="#475569" font-size="12">Ask BoB about any shipment risk, reroute option, or fleet redeployment...</text>
  <rect x="1044" y="654" width="144" height="44" rx="6" fill="#1d4ed8"/>
  <text x="1072" y="681" fill="#fff" font-size="13" font-weight="600">Send Brief</text>
  <!-- Quick action chips -->
  <rect x="28" y="706" width="210" height="28" rx="14" fill="#1e3a5f" stroke="#1e40af" stroke-width="1"/>
  <text x="44" y="725" fill="#60a5fa" font-size="10">Risk brief for SHP-1001</text>
  <rect x="248" y="706" width="200" height="28" rx="14" fill="#1e3a5f" stroke="#1e40af" stroke-width="1"/>
  <text x="264" y="725" fill="#60a5fa" font-size="10">Best reroute recommendation</text>
  <rect x="458" y="706" width="200" height="28" rx="14" fill="#1e3a5f" stroke="#1e40af" stroke-width="1"/>
  <text x="474" y="725" fill="#60a5fa" font-size="10">Idle fleet near disruption?</text>
  <rect x="668" y="706" width="210" height="28" rx="14" fill="#1e3a5f" stroke="#1e40af" stroke-width="1"/>
  <text x="684" y="725" fill="#60a5fa" font-size="10">Cold chain severity classification</text>
  <text x="600" y="790" fill="#1e3a5f" font-size="10" text-anchor="middle">RouteGuard AI | IBM BoB AI Innovation Hackathon 2026 | Team: Vibhishana assembles</text>
</svg>
